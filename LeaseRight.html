<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeaseRight</title>
<!-- Set only after Google Cloud restrictions and cost controls are verified. -->
<meta name="leaseright-maps-key" content="" />
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; font-family: ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif; }
  /* Splash — visible while Babel compiles */
  #splash {
    position: fixed; inset: 0; background: #0A0A0B;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 9999; transition: opacity 220ms ease; pointer-events: none;
  }
  #splash.gone { opacity: 0; }
  .splash-mark {
    width: 24px; height: 24px; background: #F5A524; color: #0A0A0B;
    font-family: ui-monospace, "JetBrains Mono", monospace; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
  }
  .splash-pulse {
    width: 6px; height: 6px; border-radius: 50%; background: #22C55E;
    animation: pulse 1.1s ease-in-out infinite;
  }
  #splash.failed .splash-pulse { background: #EF4444; animation: none; }
  .splash-text {
    font-family: ui-monospace, monospace; font-size: 10.5px;
    color: #6B6B74; letter-spacing: 1.5px; text-transform: uppercase;
  }
  #splash.failed .splash-text { color: #D4D4D8; letter-spacing: 0.5px; text-transform: none; }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @media (max-width: 800px) {
    .lr-model-layout { grid-template-columns: minmax(0, 1fr) !important; }
    .lr-model-sidebar { display: flex; border-right: 0 !important; }
    .lr-model-sidebar > div { display: none; }
    .lr-model-sidebar > button { flex: 1; min-width: 82px; padding: 12px 8px !important; }
    .lr-model-section-header { padding: 16px !important; }
    .lr-model-section-header > div { min-width: 0; }
    .lr-model-section-header > div > div:last-child { display: none; }
    .lr-model-card-wrap { padding: 12px !important; }
    .lr-intake-steps { padding: 0 8px !important; overflow-x: auto; grid-template-columns: repeat(5, minmax(72px, 1fr)) !important; }
  }
  /* Global smoothness */
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::selection { background: #F5A524; color: #0A0A0B; }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-mark">L</div>
  <div class="splash-pulse"></div>
  <div class="splash-text">Loading LeaseRight</div>
</div>
<div id="root"></div>
<script>
  function showLoadError() {
    var splash = document.getElementById('splash');
    splash.classList.add('failed');
    splash.setAttribute('role', 'alert');
    splash.querySelector('.splash-text').textContent = 'Unable to load LeaseRight. Check your connection and reload.';
  }
</script>
