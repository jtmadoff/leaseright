<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeaseRight</title>
<!-- Set only after Google Cloud restrictions and cost controls are verified. -->
<meta name="leaseright-maps-key" content="" />
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; font-family: ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif; }
  /* Splash — visible while Babel compiles */
  #splash {
    position: fixed; inset: 0; background: #0A0A0B;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 9999; transition: opacity 220ms ease; pointer-events: none;
  }
  #splash.gone { opacity: 0; }
  .splash-mark {
    width: 24px; height: 24px; background: #F5A524; color: #0A0A0B;
    font-family: ui-monospace, "JetBrains Mono", monospace; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
  }
  .splash-pulse {
    width: 6px; height: 6px; border-radius: 50%; background: #22C55E;
    animation: pulse 1.1s ease-in-out infinite;
  }
  #splash.failed .splash-pulse { background: #EF4444; animation: none; }
  .splash-text {
    font-family: ui-monospace, monospace; font-size: 10.5px;
    color: #6B6B74; letter-spacing: 1.5px; text-transform: uppercase;
  }
  #splash.failed .splash-text { color: #D4D4D8; letter-spacing: 0.5px; text-transform: none; }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @media (max-width: 800px) {
    .lr-model-layout { grid-template-columns: minmax(0, 1fr) !important; }
    .lr-model-sidebar { display: flex; border-right: 0 !important; }
    .lr-model-sidebar > div { display: none; }
    .lr-model-sidebar > button { flex: 1; min-width: 82px; padding: 12px 8px !important; }
    .lr-model-section-header { padding: 16px !important; }
    .lr-model-section-header > div { min-width: 0; }
    .lr-model-section-header > div > div:last-child { display: none; }
    .lr-model-card-wrap { padding: 12px !important; }
    .lr-intake-steps { padding: 0 8px !important; overflow-x: auto; grid-template-columns: repeat(5, minmax(105px, 1fr)) !important; }
  }
  .lr-intake-intro { display:none; }
  .lr-intake-layout [hidden] { display:none !important; }
  .lr-intake-layout { grid-template-columns: minmax(0,1fr) !important; }
  .lr-intake-layout > .lr-model-sidebar { display:flex; border-right:0 !important; border-bottom:1px solid #27272b; padding:0 32px; }
  .lr-intake-layout > .lr-model-sidebar > div { display:none; }
  .lr-intake-layout > .lr-model-sidebar > button { width:auto !important; min-width:150px; border-left:0 !important; padding:12px 18px !important; }
  .lr-intake-layout > .lr-model-sidebar > button > span:last-child { display:flex; gap:12px; align-items:center; }
  .lr-intake-layout > .lr-model-sidebar > button > span:last-child > span:last-child { margin-top:0 !important; font-size:9px !important; }
  .lr-property { color:var(--lr-ink); }
  .lr-property-heading { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin:0 0 24px; }
  .lr-kicker { font:10px ui-monospace,monospace; letter-spacing:1.5px; color:var(--lr-muted); }
  .lr-property h2 { margin:9px 0 8px; font-size:32px; line-height:1.15; font-weight:550; letter-spacing:-1px; }
  .lr-property-heading p { margin:0; font-size:13px; color:var(--lr-muted); line-height:1.6; }
  .lr-coverage { display:flex; align-items:center; gap:7px; color:var(--lr-muted); font-size:11px; white-space:nowrap; padding-top:5px; }
  .lr-coverage > span { width:6px; height:6px; border-radius:100%; background:#80b698; }
  .lr-search-row { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
  .lr-address-input { width:100%; box-sizing:border-box; background:var(--lr-bg); color:var(--lr-ink); border:1px solid var(--lr-rule); border-radius:6px; padding:16px; font:14px inherit; }
  .lr-text-button { padding:8px 0; background:none; border:0; color:var(--lr-muted); font-size:12px; text-decoration:underline; text-underline-offset:4px; cursor:pointer; }
  .lr-property-message { font-size:12px; color:var(--lr-accent); }
  .lr-property-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr); gap:24px; align-items:start; }
  .lr-map-panel { border:1px solid var(--lr-rule); border-radius:10px; overflow:hidden; position:sticky; top:108px; }
  .lr-map-toolbar { min-height:42px; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 16px; background:var(--lr-bg); font:9px ui-monospace,monospace; letter-spacing:1px; color:var(--lr-muted); }
  .lr-map-toolbar button { font:11px inherit; border:0; background:transparent; color:var(--lr-accent); cursor:pointer; padding:8px 0; letter-spacing:0; }
  .lr-property-map { height:430px; width:100%; }
  .lr-map-empty { height:430px; box-sizing:border-box; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; padding:28px; background-color:var(--lr-bg); background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px); background-size:32px 32px; text-align:center; }
  .lr-empty-cross { z-index:1; font-size:28px; font-weight:200; color:var(--lr-accent); margin-bottom:72px; }
  .lr-empty-parcel { position:absolute; top:70px; width:120px; height:104px; border:1px solid #f5b84b55; background:#f5b84b06; transform:rotate(-16deg) skew(-6deg); }
  .lr-map-empty strong { font-size:15px; font-weight:500; }
  .lr-map-empty p { max-width:270px; font-size:12px; line-height:1.6; color:var(--lr-muted); }
  .lr-map-caption { display:flex; align-items:flex-start; gap:12px; padding:18px; background:var(--lr-bg); border-top:1px solid var(--lr-rule); }
  .lr-pin-dot { width:8px; height:8px; border:2px solid var(--lr-accent); border-radius:100%; flex-shrink:0; margin-top:3px; }
  .lr-map-caption strong { font-size:12px; font-weight:500; }
  .lr-map-caption p { font-size:11px; line-height:1.5; color:var(--lr-muted); margin:6px 0 0; }
  .lr-facts-panel { border:1px solid var(--lr-rule); border-radius:10px; padding:22px; min-width:0; }
  .lr-facts-heading { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .lr-status { color:#dcba77; background:#e4b0510d; padding:5px 8px; border-radius:4px; font-size:10px; }
  .lr-status.confirmed { color:#92c9a6; background:#72c69312; }
  .lr-facts-panel h3 { font-size:20px; line-height:1.35; font-weight:550; letter-spacing:-.4px; margin:22px 0 6px; }
  .lr-parcel-id { color:var(--lr-muted); font:11px ui-monospace,monospace; }
  .lr-match-note { font-size:11px; line-height:1.6; color:var(--lr-muted); padding:12px 0; }
  .lr-facts-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; margin:0; }
  .lr-facts-grid > div { border-top:1px solid var(--lr-rule); padding:15px 0; min-width:0; }
  .lr-facts-grid dt { color:var(--lr-muted); font-size:11px; margin-bottom:8px; }
  .lr-facts-grid dd { margin:0; font-size:16px; font-weight:500; overflow-wrap:anywhere; }
  .lr-zoning { border-top:1px solid var(--lr-rule); padding:16px 0 8px; }
  .lr-zoning strong { display:block; margin-top:9px; font-size:16px; font-weight:500; }
  .lr-zoning p,.lr-record-footnote { font-size:11px; line-height:1.6; color:var(--lr-muted); }
  .lr-confirm-button { width:100%; border:1px solid #f5b84b66; border-radius:5px; background:#f5b84b15; color:var(--lr-accent); padding:12px 16px; font:600 12px inherit; cursor:pointer; }
  .lr-confirm-button:disabled { cursor:default; opacity:.6; }
  .lr-record-source { border-top:1px solid var(--lr-rule); padding-top:14px; font-size:10px; line-height:1.8; color:var(--lr-muted); }
  .lr-record-source a,.lr-city-link { color:var(--lr-muted); text-decoration:underline; text-underline-offset:3px; }
  .lr-city-link { display:block; font-size:11px; margin-top:18px; }
  .lr-record-empty { padding:15px 0 32px; min-height:285px; }
  .lr-record-empty p { font-size:13px; line-height:1.7; color:var(--lr-muted); }
  .lr-record-preview { font-size:12px; line-height:2.9; color:var(--lr-muted); border-top:1px solid var(--lr-rule); margin-top:24px; padding-top:12px; }
  .lr-record-preview span { display:block; }
  .lr-outline-button { border:1px solid var(--lr-rule); background:transparent; color:var(--lr-ink); padding:10px 14px; border-radius:4px; cursor:pointer; }
  .lr-parcel-select { display:block; margin-top:16px; color:var(--lr-muted); font-size:11px; }
  .lr-parcel-select select { display:block; width:100%; margin-top:8px; padding:10px; border:1px solid var(--lr-rule); border-radius:4px; color:var(--lr-ink); background:var(--lr-bg); }
  .lr-property button:focus-visible,.lr-property a:focus-visible,.lr-property input:focus-visible,.lr-property select:focus-visible { outline:2px solid var(--lr-accent); outline-offset:3px; }
  .lr-project-details { border-top:1px solid #27272b; margin-top:30px; padding-top:24px; }
  .lr-project-details-title { font-size:17px; font-weight:550; margin:0 0 6px; }
  @media(max-width:1000px) {
    .lr-property-grid { grid-template-columns:minmax(0,1.2fr) minmax(285px,1fr); gap:16px; }
    .lr-facts-panel { padding:18px; }
    .lr-coverage { white-space:normal; }
  }
  @media(max-width:760px) {
    .lr-property-grid { grid-template-columns:minmax(0,1fr); }
    .lr-property-heading { display:block; }
    .lr-coverage { margin-top:14px; }
    .lr-property h2 { font-size:28px; }
    .lr-map-panel { position:static; }
    .lr-property-map,.lr-map-empty { height:330px; }
    .lr-intake-layout > .lr-model-sidebar { padding:0 8px; }
    .lr-intake-layout > .lr-model-sidebar > button { min-width:80px; padding:12px 6px !important; }
    .lr-intake-layout > .lr-model-sidebar > button > span:last-child { display:block; }
    .lr-intake-layout > .lr-model-sidebar > button > span:last-child > span:last-child { margin-top:4px !important; }
    .lr-search-row { display:block; }
    .lr-text-button { margin-top:8px; }
    .lr-property-body { padding:18px !important; }
  }

  /* Global smoothness */
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::selection { background: #F5A524; color: #0A0A0B; }
</style>
</head>

<div id="splash">
  <div class="splash-mark">L</div>
  <div class="splash-pulse"></div>
  <div class="splash-text">Loading LeaseRight</div>

  function showLoadError() {
    var splash = document.getElementById('splash');
    splash.classList.add('failed');
    splash.setAttribute('role', 'alert');
    splash.querySelector('.splash-text').textContent = 'Unable to load LeaseRight. Check your connection and reload.';
  }
</script>
