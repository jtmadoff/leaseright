[build]
  command = "mkdir -p .netlify-publish/components && cp index.html LeaseRight.html .netlify-publish/ && cp components/*.jsx .netlify-publish/components/"
  publish = ".netlify-publish"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/leaseright"
  to = "/LeaseRight.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/LeaseRight.html"
  status = 200
